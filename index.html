<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Super Rainbow Hello World 🌈</title>
  
  <!-- SEO & Social Open Graph (Feature 9) -->
  <meta name="description" content="A vibrant, interactive Rainbow Hello World web application featuring synthesizers, custom themes, confetti, particle effects, and PWA support.">
  <meta property="og:title" content="Super Rainbow Hello World 🌈">
  <meta property="og:description" content="Interactive Rainbow Hello World with music chimes, customizable text, confetti, and themes!">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://okayokay101.github.io/super-hello-world/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#0d1117">

  <!-- PWA Manifest & Favicon (Feature 10) -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌈</text></svg>">

  <!-- Google Fonts (Feature 1) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Kanit:wght@600;800&family=Montserrat:wght@700;900&family=Poppins:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #161b22 0%, #0d1117 100%);
      --text-main: #c9d1d9;
      --text-muted: #8b949e;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.12);
      --rainbow-speed: 4s;
      --cloud-color: #ffffff;
      --cloud-shadow: rgba(0, 0, 0, 0.4);

      /* Palette: Classic */
      --c1: #ff2a5f;
      --c2: #ff7700;
      --c3: #ffcc00;
      --c4: #05d658;
      --c5: #00b4d8;
      --c6: #5e60ce;
      --c7: #9d4edd;
    }

    [data-theme="day"] {
      --bg-gradient: linear-gradient(180deg, #60b6ff 0%, #bde4ff 70%, #e0f2fe 100%);
      --text-main: #0f172a;
      --text-muted: #334155;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(15, 23, 42, 0.12);
      --cloud-shadow: rgba(0, 60, 120, 0.15);
    }

    [data-theme="night"] {
      --bg-gradient: radial-gradient(ellipse at 50% 0%, #0c1033 0%, #050714 100%);
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --card-bg: rgba(15, 23, 42, 0.8);
      --card-border: rgba(148, 163, 184, 0.2);
      --cloud-color: #cbd5e1;
      --cloud-shadow: rgba(0, 0, 0, 0.6);
    }

    [data-theme="rain"] {
      --bg-gradient: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --card-bg: rgba(30, 41, 59, 0.8);
      --card-border: rgba(255, 255, 255, 0.1);
      --cloud-color: #94a3b8;
      --cloud-shadow: rgba(0, 0, 0, 0.5);
    }

    /* Palette Themes (Feature 5) */
    [data-palette="pastel"] {
      --c1: #ff9aa2; --c2: #ffb7b2; --c3: #ffdac1;
      --c4: #e2f0cb; --c5: #b5ead7; --c6: #c7ceea; --c7: #e0bbff;
    }
    [data-palette="neon"] {
      --c1: #ff007f; --c2: #ff5e00; --c3: #ffff00;
      --c4: #00ff66; --c5: #00f0ff; --c6: #7000ff; --c7: #e000ff;
    }
    [data-palette="gold"] {
      --c1: #fff3b0; --c2: #ffd166; --c3: #e9c46a;
      --c4: #f4a261; --c5: #e76f51; --c6: #d4a373; --c7: #faedcd;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: var(--bg-gradient);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text-main);
      text-align: center;
      padding: 30px 16px 80px 16px;
      overflow-x: hidden;
      position: relative;
      transition: background 0.6s ease, color 0.4s ease;
    }

    /* Background Rain Simulation (Feature 4) */
    .rain-container {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    [data-theme="rain"] .rain-container {
      display: block;
    }
    .drop {
      position: absolute;
      background: linear-gradient(to bottom, transparent, rgba(147, 197, 253, 0.6));
      width: 2px;
      height: 35px;
      animation: fall 0.8s linear infinite;
    }
    @keyframes fall {
      0% { transform: translateY(-50px); }
      100% { transform: translateY(105vh); }
    }

    /* Canvas Overlays (Features 3 & 6) */
    #sparkle-canvas, #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }
    #confetti-canvas {
      z-index: 999;
    }

    /* App Container */
    .app-card {
      position: relative;
      z-index: 5;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Rainbow Graphic */
    .rainbow-wrapper {
      width: 100%;
      max-width: 480px;
      margin-bottom: 1.2rem;
      position: relative;
      cursor: pointer;
    }

    .rainbow-svg {
      width: 100%;
      height: auto;
      overflow: visible;
      animation: gentle-float 4s ease-in-out infinite alternate;
    }

    .arc {
      stroke-dasharray: 650;
      stroke-dashoffset: 650;
      animation: draw-arc 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      filter: drop-shadow(0 0 6px currentColor);
      transition: stroke 0.4s ease, stroke-width 0.2s ease, filter 0.2s ease;
      cursor: pointer;
    }
    .arc:hover {
      stroke-width: 16 !important;
      filter: drop-shadow(0 0 14px currentColor) brightness(1.3);
    }
    .arc.active-chime {
      stroke-width: 18 !important;
      filter: drop-shadow(0 0 20px #ffffff) brightness(1.5);
    }

    .arc-1 { stroke: var(--c1); animation-delay: 0.05s; }
    .arc-2 { stroke: var(--c2); animation-delay: 0.12s; }
    .arc-3 { stroke: var(--c3); animation-delay: 0.19s; }
    .arc-4 { stroke: var(--c4); animation-delay: 0.26s; }
    .arc-5 { stroke: var(--c5); animation-delay: 0.33s; }
    .arc-6 { stroke: var(--c6); animation-delay: 0.40s; }
    .arc-7 { stroke: var(--c7); animation-delay: 0.47s; }

    @keyframes draw-arc {
      0% { stroke-dashoffset: 650; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes gentle-float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }

    .cloud-group {
      animation: cloud-pulse 3s ease-in-out infinite alternate;
      transform-origin: center;
      transition: fill 0.4s ease;
    }
    .cloud-left { animation-delay: 0s; }
    .cloud-right { animation-delay: 1.5s; }

    @keyframes cloud-pulse {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.05) translateY(-4px); }
    }

    /* Rainbow Headline */
    .rainbow-text {
      font-size: clamp(2.8rem, 8vw, 5.5rem);
      font-weight: 900;
      letter-spacing: -1.5px;
      line-height: 1.15;
      background: linear-gradient(
        90deg,
        var(--c1),
        var(--c2),
        var(--c3),
        var(--c4),
        var(--c5),
        var(--c6),
        var(--c7),
        var(--c1)
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: rainbow-animation var(--rainbow-speed) linear infinite;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      margin-bottom: 0.6rem;
      cursor: pointer;
      user-select: none;
      word-break: break-word;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .rainbow-text:active {
      transform: scale(0.96);
    }

    @keyframes rainbow-animation {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    .subtitle {
      font-size: 1.15rem;
      color: var(--text-muted);
      max-width: 560px;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }

    /* Live Customizer Bar (Feature 1) */
    .customizer-box {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 16px 20px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 1.5rem;
    }

    .input-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .text-input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-size: 1rem;
      outline: none;
      transition: border 0.2s ease, box-shadow 0.2s ease;
    }
    .text-input:focus {
      border-color: var(--c4);
      box-shadow: 0 0 0 3px rgba(5, 214, 88, 0.2);
    }

    .font-select {
      padding: 10px 14px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 0.95rem;
      cursor: pointer;
      outline: none;
    }
    .font-select option {
      background: #161b22;
      color: #ffffff;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      transition: all 0.2s ease;
      user-select: none;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.14);
      transform: translateY(-2px);
    }
    .btn:active {
      transform: translateY(0);
    }

    .btn-celebrate {
      background: linear-gradient(135deg, var(--c1), var(--c3));
      color: #ffffff;
      border: none;
    }
    .btn-celebrate:hover {
      filter: brightness(1.15);
      box-shadow: 0 4px 16px rgba(255, 42, 95, 0.35);
    }

    /* Floating Toolbar / Control Panel (Feature 8) */
    .floating-toolbar {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.85rem;
    }

    .tool-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-icon-btn, .palette-pill {
      background: none;
      border: 1px solid transparent;
      padding: 4px 8px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1rem;
      transition: all 0.2s ease;
    }
    .theme-icon-btn.active, .theme-icon-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--card-border);
    }

    .palette-pill {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 8px;
      border: 1px solid var(--card-border);
    }
    .palette-pill.active {
      background: var(--text-main);
      color: #0d1117;
    }

    .slider-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .speed-slider {
      width: 70px;
      cursor: pointer;
    }

    /* Toast Notification (Feature 7) */
    .toast {
      position: fixed;
      top: 24px;
      background: rgba(16, 185, 129, 0.95);
      color: #ffffff;
      padding: 10px 22px;
      border-radius: 30px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      z-index: 1000;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Sound Hint */
    .sound-hint {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 0.4rem;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    /* Reduced Motion (Feature 9) */
    @media (prefers-reduced-motion: reduce) {
      .rainbow-text {
        animation: none;
        background-position: 50% 50%;
      }
      .rainbow-svg, .cloud-group, .arc {
        animation: none !important;
        stroke-dashoffset: 0 !important;
      }
      #sparkle-canvas, #confetti-canvas, .rain-container {
        display: none !important;
      }
    }

    /* Responsive */
    @media (max-width: 600px) {
      .input-row {
        flex-direction: column;
      }
      .floating-toolbar {
        bottom: 10px;
        right: 10px;
        left: 10px;
        justify-content: space-between;
        flex-wrap: wrap;
      }
    }
  </style>
</head>
<body data-theme="dark" data-palette="classic">

  <div class="rain-container" id="rainContainer"></div>
  <canvas id="sparkle-canvas"></canvas>
  <canvas id="confetti-canvas"></canvas>
  <div class="toast" id="toastMsg">Link copied to clipboard! 📋</div>

  <div class="app-card">
    <!-- Animated SVG Rainbow (Feature 2) -->
    <div class="rainbow-wrapper" id="rainbowWrapper" title="Click to play rainbow chimes & launch confetti!">
      <svg class="rainbow-svg" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Interactive musical rainbow with clouds">
        <defs>

            <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
          </filter>
        </defs>

        <!-- 7 Rainbow Arcs with Web Audio Chime triggers -->
        <g fill="none" stroke-width="11" stroke-linecap="round">
          <path class="arc arc-1" id="arc-1" data-note="C5" d="M 80 230 A 170 170 0 0 1 420 230" role="button" aria-label="Red Arc - Note C5" />
          <path class="arc arc-2" id="arc-2" data-note="D5" d="M 91 230 A 159 159 0 0 1 409 230" role="button" aria-label="Orange Arc - Note D5" />
          <path class="arc arc-3" id="arc-3" data-note="E5" d="M 102 230 A 148 148 0 0 1 398 230" role="button" aria-label="Yellow Arc - Note E5" />
          <path class="arc arc-4" id="arc-4" data-note="F5" d="M 113 230 A 137 137 0 0 1 387 230" role="button" aria-label="Green Arc - Note F5" />
          <path class="arc arc-5" id="arc-5" data-note="G5" d="M 124 230 A 126 126 0 0 1 376 230" role="button" aria-label="Cyan Arc - Note G5" />
          <path class="arc arc-6" id="arc-6" data-note="A5" d="M 135 230 A 115 115 0 0 1 365 230" role="button" aria-label="Indigo Arc - Note A5" />
          <path class="arc arc-7" id="arc-7" data-note="B5" d="M 146 230 A 104 104 0 0 1 354 230" role="button" aria-label="Violet Arc - Note B5" />
        </g>

        <!-- Left Cloud -->
        <g class="cloud-group cloud-left" filter="url(#cloud-shadow)">
          <ellipse cx="78" cy="235" rx="36" ry="22" fill="var(--cloud-color, #e6edf3)" />
          <circle cx="58" cy="225" r="22" fill="var(--cloud-color, #ffffff)" />
          <circle cx="82" cy="210" r="28" fill="var(--cloud-color, #ffffff)" />
          <circle cx="108" cy="224" r="22" fill="var(--cloud-color, #f0f6fc)" />
        </g>

        <!-- Right Cloud -->
        <g class="cloud-group cloud-right" filter="url(#cloud-shadow)">
          <ellipse cx="422" cy="235" rx="36" ry="22" fill="var(--cloud-color, #e6edf3)" />
          <circle cx="392" cy="224" r="22" fill="var(--cloud-color, #f0f6fc)" />
          <circle cx="418" cy="210" r="28" fill="var(--cloud-color, #ffffff)" />
          <circle cx="442" cy="225" r="22" fill="var(--cloud-color, #ffffff)" />
        </g>
      </svg>
    </div>

    <!-- Musical hint -->
    <div class="sound-hint">🎵 Hover or click rainbow arcs to play chimes!</div>

    <!-- Rainbow Headline -->
    <h1 class="rainbow-text" id="displayHeadline">Hello, World!</h1>
    <p class="subtitle" id="displaySubtitle">A vibrant animated rainbow text page with interactive chimes & celebration</p>

    <!-- Interactive Customizer (Feature 1) -->
    <div class="customizer-box">
      <div class="input-row">
        <input type="text" class="text-input" id="textInput" placeholder="Type your message here..." value="Hello, World!" maxlength="36">
        <select class="font-select" id="fontSelect">
          <option value="system-ui">System Default</option>
          <option value="'Poppins', sans-serif">Poppins</option>
          <option value="'Kanit', sans-serif">Kanit</option>
          <option value="'Montserrat', sans-serif">Montserrat</option>
          <option value="'Fredoka', sans-serif">Fredoka</option>
        </select>
      </div>

      <div class="actions-row">
        <button class="btn btn-celebrate" id="btnCelebrate">🎉 Celebrate</button>
        <button class="btn" id="btnCopyLink">🔗 Share Link</button>
        <button class="btn" id="btnExportPNG">📷 Export PNG</button>
      </div>
    </div>
  </div>

  <!-- Floating Toolbar (Feature 8) -->
  <div class="floating-toolbar">
    <!-- Themes (Feature 4) -->
    <div class="tool-group">
      <button class="theme-icon-btn active" data-set-theme="dark" title="Dark Theme">🌙</button>
      <button class="theme-icon-btn" data-set-theme="day" title="Day Sky">☀️</button>
      <button class="theme-icon-btn" data-set-theme="night" title="Starry Night">✨</button>
      <button class="theme-icon-btn" data-set-theme="rain" title="Rainy Rainbow">🌧️</button>
    </div>

    <!-- Palette (Feature 5) -->
    <div class="tool-group">
      <button class="palette-pill active" data-set-palette="classic">Classic</button>
      <button class="palette-pill" data-set-palette="pastel">Pastel</button>
      <button class="palette-pill" data-set-palette="neon">Neon</button>
      <button class="palette-pill" data-set-palette="gold">Gold</button>
    </div>

    <!-- Speed Slider (Feature 8) -->
    <div class="slider-box" title="Animation Speed">
      <span>⚡</span>
      <input type="range" id="speedSlider" class="speed-slider" min="1" max="8" value="4" step="0.5">
    </div>

    <!-- Fullscreen (Feature 8) -->
    <button class="btn" id="btnFullscreen" title="Toggle Fullscreen" style="padding: 4px 8px;">⛶</button>
  </div>

  <script>
    // --- 1. Audio Synthesizer (Feature 2) ---
    const NOTE_FREQS = {
      'C5': 523.25,
      'D5': 587.33,
      'E5': 659.25,
      'F5': 698.46,
      'G5': 783.99,
      'A5': 880.00,
      'B5': 987.77
    };

    let audioCtx = null;
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playChime(noteName) {
      try {
        const ctx = getAudioContext();
        const freq = NOTE_FREQS[noteName] || 523.25;
        const now = ctx.currentTime;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);

        // Bell chime harmonic
        const osc2 = ctx.createOscillator();
        const gain2 = ctx.createGain();
        osc2.type = 'triangle';
        osc2.frequency.setValueAtTime(freq * 2, now);

        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 1.2);

        gain2.gain.setValueAtTime(0.08, now);
        gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.6);

        osc.connect(gain);
        osc2.connect(gain2);
        gain.connect(ctx.destination);
        gain2.connect(ctx.destination);

        osc.start(now);
        osc2.start(now);
        osc.stop(now + 1.2);
        osc2.stop(now + 0.6);
      } catch (e) {
        // Audio policy exception handling
      }
    }

    // Attach Chime Events to Arcs
    document.querySelectorAll('.arc').forEach(arc => {
      const note = arc.dataset.note;
      const trigger = () => {
        playChime(note);
        arc.classList.add('active-chime');
        setTimeout(() => arc.classList.remove('active-chime'), 400);
      };
      arc.addEventListener('mouseenter', trigger);
      arc.addEventListener('click', trigger);
    });

    // --- 2. Live Text Customizer & Font Selector (Feature 1) ---
    const textInput = document.getElementById('textInput');
    const fontSelect = document.getElementById('fontSelect');
    const displayHeadline = document.getElementById('displayHeadline');

    textInput.addEventListener('input', () => {
      const val = textInput.value.trim();
      displayHeadline.textContent = val || 'Hello, World!';
    });

    fontSelect.addEventListener('change', () => {
      displayHeadline.style.fontFamily = fontSelect.value;
    });

    // --- 3. URL Parameter Reading (?msg=... &theme=...) (Feature 7) ---
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('msg')) {
      const msg = urlParams.get('msg');
      textInput.value = msg;
      displayHeadline.textContent = msg;
    }
    if (urlParams.has('theme')) {
      setTheme(urlParams.get('theme'));
    }
    if (urlParams.has('palette')) {
      setPalette(urlParams.get('palette'));
    }

    // --- 4. Themes & Palettes (Features 4 & 5) ---
    function setTheme(theme) {
      document.body.setAttribute('data-theme', theme);
      document.querySelectorAll('[data-set-theme]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.setTheme === theme);
      });
      if (theme === 'rain') initRain();
    }

    function setPalette(palette) {
      document.body.setAttribute('data-palette', palette);
      document.querySelectorAll('[data-set-palette]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.setPalette === palette);
      });
    }

    document.querySelectorAll('[data-set-theme]').forEach(btn => {
      btn.addEventListener('click', () => setTheme(btn.dataset.setTheme));
    });
    document.querySelectorAll('[data-set-palette]').forEach(btn => {
      btn.addEventListener('click', () => setPalette(btn.dataset.setPalette));
    });

    // Rain drop generator
    function initRain() {
      const container = document.getElementById('rainContainer');
      container.innerHTML = '';
      for (let i = 0; i < 40; i++) {
        const drop = document.createElement('div');
        drop.className = 'drop';
        drop.style.left = Math.random() * 100 + 'vw';
        drop.style.animationDuration = (0.5 + Math.random() * 0.5) + 's';
        drop.style.animationDelay = (Math.random() * 2) + 's';
        container.appendChild(drop);
      }
    }

    // --- 5. Sparkle Particle Cursor Trail (Feature 3) ---
    const sparkleCanvas = document.getElementById('sparkle-canvas');
    const sCtx = sparkleCanvas.getContext('2d');
    let sparkles = [];

    function resizeSparkle() {
      sparkleCanvas.width = window.innerWidth;
      sparkleCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeSparkle);
    resizeSparkle();

    function addSparkle(x, y, count = 2) {
      const colors = ['#ff2a5f', '#ff7700', '#ffcc00', '#05d658', '#00b4d8', '#5e60ce', '#9d4edd', '#ffffff'];
      for (let i = 0; i < count; i++) {
        sparkles.push({
          x: x + (Math.random() - 0.5) * 15,
          y: y + (Math.random() - 0.5) * 15,
          vx: (Math.random() - 0.5) * 2,
          vy: (Math.random() - 0.5) * 2 - 1,
          size: Math.random() * 3 + 1.5,
          color: colors[Math.floor(Math.random() * colors.length)],
          alpha: 1,
          decay: Math.random() * 0.02 + 0.02
        });
      }
    }

    window.addEventListener('mousemove', e => addSparkle(e.clientX, e.clientY, 2));
    window.addEventListener('touchmove', e => {
      if (e.touches.length > 0) {
        addSparkle(e.touches[0].clientX, e.touches[0].clientY, 3);
      }
    });
    window.addEventListener('click', e => addSparkle(e.clientX, e.clientY, 16));

    function animateSparkles() {
      sCtx.clearRect(0, 0, sparkleCanvas.width, sparkleCanvas.height);
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const p = sparkles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          sparkles.splice(i, 1);
          continue;
        }
        sCtx.save();
        sCtx.globalAlpha = p.alpha;
        sCtx.fillStyle = p.color;
        sCtx.beginPath();
        sCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        sCtx.fill();
        sCtx.restore();
      }
      requestAnimationFrame(animateSparkles);
    }
    animateSparkles();

    // --- 6. Confetti Celebration Mode (Feature 6) ---
    const confettiCanvas = document.getElementById('confetti-canvas');
    const cCtx = confettiCanvas.getContext('2d');
    let confetti = [];

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function launchConfetti() {
      const colors = ['#ff2a5f', '#ff7700', '#ffcc00', '#05d658', '#00b4d8', '#5e60ce', '#9d4edd', '#ffffff', '#ffd166'];
      for (let i = 0; i < 90; i++) {
        confetti.push({
          x: window.innerWidth / 2,
          y: window.innerHeight * 0.45,
          vx: (Math.random() - 0.5) * 16,
          vy: Math.random() * -14 - 4,
          size: Math.random() * 8 + 6,
          color: colors[Math.floor(Math.random() * colors.length)],
          rotation: Math.random() * 360,
          rotSpeed: (Math.random() - 0.5) * 10,
          alpha: 1
        });
      }
      // Play ascending harp chime
      Object.keys(NOTE_FREQS).forEach((note, idx) => {
        setTimeout(() => playChime(note), idx * 75);
      });
    }

    function animateConfetti() {
      cCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      for (let i = confetti.length - 1; i >= 0; i--) {
        const p = confetti[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35; // gravity
        p.rotation += p.rotSpeed;
        p.alpha -= 0.008;

        if (p.alpha <= 0 || p.y > confettiCanvas.height) {
          confetti.splice(i, 1);
          continue;
        }

        cCtx.save();
        cCtx.globalAlpha = p.alpha;
        cCtx.translate(p.x, p.y);
        cCtx.rotate((p.rotation * Math.PI) / 180);
        cCtx.fillStyle = p.color;
        cCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        cCtx.restore();
      }
      requestAnimationFrame(animateConfetti);
    }
    animateConfetti();

    document.getElementById('btnCelebrate').addEventListener('click', launchConfetti);
    document.getElementById('rainbowWrapper').addEventListener('click', launchConfetti);
    displayHeadline.addEventListener('click', launchConfetti);

    // --- 7. Snapshot & Export PNG (Feature 7) ---
    document.getElementById('btnExportPNG').addEventListener('click', () => {
      const exportCanvas = document.createElement('canvas');
      exportCanvas.width = 1200;
      exportCanvas.height = 675;
      const eCtx = exportCanvas.getContext('2d');

      // Background
      const bgGrad = eCtx.createRadialGradient(600, 200, 50, 600, 337, 700);
      bgGrad.addColorStop(0, '#161b22');
      bgGrad.addColorStop(1, '#0d1117');
      eCtx.fillStyle = bgGrad;
      eCtx.fillRect(0, 0, 1200, 675);

      // Draw Rainbow Arcs
      const colors = ['#ff2a5f', '#ff7700', '#ffcc00', '#05d658', '#00b4d8', '#5e60ce', '#9d4edd'];
      eCtx.lineWidth = 22;
      eCtx.lineCap = 'round';
      colors.forEach((col, idx) => {
        eCtx.beginPath();
        eCtx.strokeStyle = col;
        eCtx.arc(600, 480, 260 - idx * 24, Math.PI, 0, false);
        eCtx.stroke();
      });

      // Headline Text
      eCtx.textAlign = 'center';
      eCtx.font = '900 64px -apple-system, sans-serif';
      const textGrad = eCtx.createLinearGradient(200, 0, 1000, 0);
      colors.forEach((col, i) => textGrad.addColorStop(i / (colors.length - 1), col));
      eCtx.fillStyle = textGrad;
      eCtx.fillText(displayHeadline.textContent, 600, 560);

      // Footer
      eCtx.font = '500 24px -apple-system, sans-serif';
      eCtx.fillStyle = '#8b949e';
      eCtx.fillText('Created with Super Rainbow Hello World', 600, 615);

      // Download
      const link = document.createElement('a');
      link.download = 'rainbow-hello-world.png';
      link.href = exportCanvas.toDataURL('image/png');
      link.click();
      showToast('Exported PNG Card! 📷');
    });

    // Share Link
    document.getElementById('btnCopyLink').addEventListener('click', () => {
      const currentText = encodeURIComponent(textInput.value.trim());
      const currentTheme = document.body.getAttribute('data-theme') || 'dark';
      const currentPalette = document.body.getAttribute('data-palette') || 'classic';
      const shareUrl = window.location.origin + window.location.pathname + '?msg=' + currentText + '&theme=' + currentTheme + '&palette=' + currentPalette;

      navigator.clipboard.writeText(shareUrl).then(() => {
        showToast('Link copied to clipboard! 📋');
      }).catch(() => {
        prompt('Copy your link:', shareUrl);
      });
    });

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    // --- 8. Animation Speed & Fullscreen (Feature 8) ---
    const speedSlider = document.getElementById('speedSlider');
    speedSlider.addEventListener('input', () => {
      const val = speedSlider.value;
      const seconds = (10 - val) + 's';
      document.documentElement.style.setProperty('--rainbow-speed', seconds);
    });

    document.getElementById('btnFullscreen').addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // --- 9. PWA Service Worker Registration (Feature 10) ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>

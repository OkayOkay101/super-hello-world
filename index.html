<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainbow Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #c9d1d9;
      text-align: center;
      padding: 24px;
      overflow-x: hidden;
    }

    /* Rainbow illustration wrapper */
    .rainbow-wrapper {
      width: 100%;
      max-width: 460px;
      margin-bottom: 1rem;
      position: relative;
    }

    .rainbow-svg {
      width: 100%;
      height: auto;
      overflow: visible;
      animation: gentle-float 4s ease-in-out infinite alternate;
    }

    /* Hand-drawn rainbow stroke draw-in animation */
    .arc {
      stroke-dasharray: 650;
      stroke-dashoffset: 650;
      animation: draw-arc 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      filter: drop-shadow(0 0 6px currentColor);
    }

    .arc-1 { stroke: #ff2a5f; animation-delay: 0.1s; }
    .arc-2 { stroke: #ff7700; animation-delay: 0.2s; }
    .arc-3 { stroke: #ffcc00; animation-delay: 0.3s; }
    .arc-4 { stroke: #05d658; animation-delay: 0.4s; }
    .arc-5 { stroke: #00b4d8; animation-delay: 0.5s; }
    .arc-6 { stroke: #5e60ce; animation-delay: 0.6s; }
    .arc-7 { stroke: #9d4edd; animation-delay: 0.7s; }

    @keyframes draw-arc {
      0% {
        stroke-dashoffset: 650;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }

    @keyframes gentle-float {
      0% {
        transform: translateY(0px);
      }
      100% {
        transform: translateY(-10px);
      }
    }

    /* Fluffy Clouds */
    .cloud-group {
      animation: cloud-pulse 3s ease-in-out infinite alternate;
      transform-origin: center;
    }

    .cloud-left {
      animation-delay: 0s;
    }

    .cloud-right {
      animation-delay: 1.5s;
    }

    @keyframes cloud-pulse {
      0% {
        transform: scale(1) translateY(0);
      }
      100% {
        transform: scale(1.04) translateY(-3px);
      }
    }

    .rainbow-text {
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(
        90deg,
        #ff0055,
        #ff5500,
        #ffcc00,
        #00dd55,
        #00bbff,
        #7700ff,
        #ff00aa,
        #ff0055
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: rainbow-animation 4s linear infinite;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }

    @keyframes rainbow-animation {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }

    .subtitle {
      font-size: 1.25rem;
      color: #8b949e;
      max-width: 600px;
      line-height: 1.6;
    }

    .badge {
      display: inline-block;
      margin-top: 2rem;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <!-- Animated Custom Hand-drawn Rainbow with Clouds -->
  <div class="rainbow-wrapper">
    <svg class="rainbow-svg" viewBox="0 0 500 280" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="cloud-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
        </filter>
      </defs>

      <!-- 7 Rainbow Arcs -->
      <g fill="none" stroke-width="11" stroke-linecap="round">
        <path class="arc arc-1" d="M 80 230 A 170 170 0 0 1 420 230" />
        <path class="arc arc-2" d="M 91 230 A 159 159 0 0 1 409 230" />
        <path class="arc arc-3" d="M 102 230 A 148 148 0 0 1 398 230" />
        <path class="arc arc-4" d="M 113 230 A 137 137 0 0 1 387 230" />
        <path class="arc arc-5" d="M 124 230 A 126 126 0 0 1 376 230" />
        <path class="arc arc-6" d="M 135 230 A 115 115 0 0 1 365 230" />
        <path class="arc arc-7" d="M 146 230 A 104 104 0 0 1 354 230" />
      </g>

      <!-- Left Cloud -->
      <g class="cloud-group cloud-left" filter="url(#cloud-shadow)">
        <ellipse cx="78" cy="235" rx="36" ry="22" fill="#e6edf3" />
        <circle cx="58" cy="225" r="22" fill="#ffffff" />
        <circle cx="82" cy="210" r="28" fill="#ffffff" />
        <circle cx="108" cy="224" r="22" fill="#f0f6fc" />
      </g>

      <!-- Right Cloud -->
      <g class="cloud-group cloud-right" filter="url(#cloud-shadow)">
        <ellipse cx="422" cy="235" rx="36" ry="22" fill="#e6edf3" />
        <circle cx="392" cy="224" r="22" fill="#f0f6fc" />
        <circle cx="418" cy="210" r="28" fill="#ffffff" />
        <circle cx="442" cy="225" r="22" fill="#ffffff" />
      </g>
    </svg>
  </div>

  <h1 class="rainbow-text">Hello, World!</h1>
  <p class="subtitle">A vibrant animated rainbow text page</p>
  <div class="badge">🚀 Hosted on GitHub Pages</div>
</body>
</html>

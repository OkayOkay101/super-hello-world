<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rainbow Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #c9d1d9;
      text-align: center;
      padding: 20px;
    }
    .rainbow-text {
      font-size: clamp(3rem, 10vw, 6.5rem);
      font-weight: 900;
      letter-spacing: -2px;
      background: linear-gradient(
        90deg,
        #ff0055,
        #ff5500,
        #ffcc00,
        #00dd55,
        #00bbff,
        #7700ff,
        #ff00aa,
        #ff0055
      );
      background-size: 200% auto;
      color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      animation: rainbow-animation 4s linear infinite;
      text-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      margin-bottom: 1.5rem;
    }
    @keyframes rainbow-animation {
      0% {
        background-position: 0% 50%;
      }
      100% {
        background-position: 200% 50%;
      }
    }
    .subtitle {
      font-size: 1.25rem;
      color: #8b949e;
      max-width: 600px;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      margin-top: 2rem;
      padding: 8px 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-size: 0.9rem;
      color: #58a6ff;
    }
  </style>
</head>
<body>
  <h1 class="rainbow-text">Hello, World!</h1>
  <p class="subtitle">A vibrant animated rainbow text page</p>
  <div class="badge">🚀 Hosted on GitHub Pages</div>
</body>
</html>
